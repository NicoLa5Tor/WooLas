services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-woolas}
      POSTGRES_USER: ${POSTGRES_USER:-woolas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-woolas}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-woolas} -d ${POSTGRES_DB:-woolas}"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
  data:
